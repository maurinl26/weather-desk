services:
  weather-desk:
    build:
      context: ../..
      dockerfile: deploy/mac-mini/Dockerfile
    container_name: weather-desk
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - weather-desk-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PANEL_BASIC_AUTH_JSON: ${PANEL_BASIC_AUTH_JSON:?Run the deploy script to create credentials}
      PANEL_COOKIE_SECRET: ${PANEL_COOKIE_SECRET:?Run the deploy script to create the cookie secret}
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5006/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  weather-desk-data:
    name: weather-desk-data
